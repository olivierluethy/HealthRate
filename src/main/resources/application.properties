# ============================================================
#  Swiss Health Insurance Premium Calculator API
#  Quarkus configuration
# ============================================================

# --- Datasource (PostgreSQL via Docker) ---
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=praemien
quarkus.datasource.password=praemien
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/praemiendb

# --- Hibernate ORM ---
# Recreate the schema on every start. Convenient for a demo; switch to
# "validate" or use Flyway/Liquibase migrations in a real deployment.
quarkus.hibernate-orm.database.generation=drop-and-create

# --- HTTP / CORS ---
quarkus.http.port=8080
quarkus.http.cors=true
quarkus.http.cors.origins=*

# --- OpenAPI / Swagger UI ---
quarkus.smallrye-openapi.path=/api/openapi
quarkus.swagger-ui.always-include=true

# ============================================================
#  Test profile: use an in-memory H2 database so the test
#  suite runs without Docker or a running PostgreSQL instance.
# ============================================================
%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.username=sa
%test.quarkus.datasource.password=sa
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:praemien;DB_CLOSE_DELAY=-1
%test.quarkus.hibernate-orm.database.generation=drop-and-create
# Use a random free port for tests so the suite never clashes with a process
# already bound to the default test port (8081).
%test.quarkus.http.test-port=0
